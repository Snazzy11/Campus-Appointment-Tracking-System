[project]
name = "campus-messaging-backend"
version = "0.1.0"
description = "FastAPI and PostgreSQL backend for the Campus Messaging Expo app"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "PyJWT[crypto]>=2.9,<3",
  "sqlalchemy>=2,<3",
  "psycopg[binary]>=3,<4",
  "alembic>=1.16,<2",
  "pillow>=12,<13",
  "boto3>=1.40,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
