# Generated by OpenAI Codex on 2026-11-01.
# Shared configuration. Select an explicit dev/test/prod overlay using Make.
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  db:
    image: cats-db:${CATS_TAG:-local}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: cats
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-local-admin-only}
      DB_PASSWORD: ${DB_PASSWORD:-cats-devonly}
    volumes: [postgres-data:/var/lib/postgresql]
    networks: [database]
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d cats"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    image: cats-api:${CATS_TAG:-local}
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:-cats-devonly}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
    depends_on:
      db: {condition: service_healthy}
    networks: [application, database]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    image: cats-web:${CATS_TAG:-local}
    depends_on:
      api: {condition: service_healthy}
    ports: ["127.0.0.1:${CATS_PORT:-18082}:8080"]
    networks: [application]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
networks:
  application:
  database:
    internal: true
volumes:
  postgres-data:
