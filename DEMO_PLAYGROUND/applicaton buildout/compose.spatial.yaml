name: campus-buildout-spatial
services:
  db:
    build: ./deploy/spatial
    environment:
      POSTGRES_USER: spatial
      POSTGRES_PASSWORD: local-spatial-test-only
      POSTGRES_DB: campus_spatial
    ports: ["127.0.0.1:5435:5432"]
    volumes: ["spatial-data:/var/lib/postgresql/data"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spatial -d campus_spatial"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  spatial-data:
