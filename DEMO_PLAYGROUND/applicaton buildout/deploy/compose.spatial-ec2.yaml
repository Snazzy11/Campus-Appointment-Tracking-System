name: campus-spatial
services:
  spatial:
    image: campus-spatial:bootstrap
    restart: unless-stopped
    environment:
      POSTGRES_USER: spatial
      POSTGRES_PASSWORD: ${SPATIAL_PASSWORD:?Required}
      POSTGRES_DB: campus_spatial
    volumes: [spatial-data:/var/lib/postgresql/data]
    networks:
      application:
        aliases: [campus-spatial-db]
    mem_limit: 384m
    cpus: 0.50
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U spatial -d campus_spatial']
      interval: 5s
      timeout: 5s
      retries: 20
networks:
  application:
    external: true
    name: ${APPLICATION_NETWORK:?Required}
volumes:
  spatial-data:
