[project]
name = "cats"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Parker Scott", email = "98108108+Snazzy11@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "psycopg2-binary>=2.9.13",
    "selenium>=4.51.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.0",
]

[tool.pyright]
include = ["cats"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
