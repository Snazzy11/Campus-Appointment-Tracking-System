name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint, format, and type check
        run: make validate-backend
  backend_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: make test-backend
  migrations_check:
    # Fails when a model was changed without a matching migration (see back_end/README.md)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      db:
        # Same image as docker-compose.yml
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: cats
          POSTGRES_PASSWORD: cats-devonly
          POSTGRES_DB: cats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cats -d cats"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://cats:cats-devonly@127.0.0.1:5432/cats
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Also fails if two merged branches both added a migration ("multiple heads")
      - name: Apply all migrations
        run: uv run alembic upgrade head

      - name: Check that the models match the migrations
        run: |
          if ! uv run alembic check; then
            echo "::error::A model changed without a migration. Run: make db-revision m=\"describe the change\", review the new file in alembic/versions/, and commit it."
            exit 1
          fi
  frontend_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from "packageManager" in the root package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: front_end/pnpm-lock.yaml

      - name: Install dependencies
        run: make setup-frontend

      - name: Lint, format, and type check
        run: make validate-frontend
  build:
    needs: [backend_validation, backend_tests, migrations_check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=min
          tags: app:${{ github.sha }}
