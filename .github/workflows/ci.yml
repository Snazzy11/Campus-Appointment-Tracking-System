name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint, format, and type check
        run: make validate-backend test-api
  frontend_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from "packageManager" in the root package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: front_end/pnpm-lock.yaml

      - name: Install dependencies
        run: make setup-frontend

      - name: Lint, format, and type check
        run: make validate-frontend test-map-editor
  build:
    needs: backend_validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=min
          tags: app:${{ github.sha }}

  container_integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the complete stack
        run: make stack-test
      - name: Show logs on failure
        if: failure()
        run: docker compose -p cats-test -f compose.yaml -f compose.build.yaml logs --tail=100
      - name: Stop test containers
        if: always()
        run: make stack-down

  map_database_integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Start PostGIS and import the local map
        run: make db-up
      - name: Verify map queries, permissions, transactions, and audit history
        env:
          MAP_TEST_DATABASE_URL: postgresql+psycopg2://postgres:local-admin-only@127.0.0.1:15434/cats
          PYTHONPATH: back_end/app
        run: uv run pytest tests/backend/test_map_postgis.py -v
      - name: Stop local database
        if: always()
        run: make dev-down
