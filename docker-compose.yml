name: cats

services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg2://cats:cats-devonly@db:5432/cats"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy

  db:
    platform: linux/amd64
    image: postgis/postgis:18-3.6
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cats
      POSTGRES_PASSWORD: cats-devonly
      POSTGRES_DB: cats
    volumes:
      - cats_data_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cats -d cats"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  # PostgreSQL 16 data remains in cats_cats_data; migrate via dump/restore.
  cats_data_pg18:
